<!-- MAIN CONTENT: unique page content begins here. -->
<main><section class="page-banner"><div class="container"><h2>Gallery</h2>
    <p>Images from Kemo Citrus.</p></div></section>
<section class="section"><div class="container"><div class="gallery-grid">
<button class="gallery-trigger" type="button" aria-label="View citrus farm image">
    <img loading="lazy" src="images/farm.jpg" alt="Illustration of a citrus farm"></button>
    <button class="gallery-trigger" type="button" aria-label="View oranges image">
        <img loading="lazy" src="images/oranges.jpg" alt="Illustration of fresh oranges">
    </button><button class="gallery-trigger" type="button" aria-label="View lemons image">
        <img loading="lazy" src="images/lemons.jpg" alt="Illustration of fresh lemons"></button>
        <button class="gallery-trigger" type="button" aria-label="View mandarins image">
            <img loading="lazy" src="images/mandarins.jpg" alt="Illustration of fresh mandarins"></button>
</div>
<!-- Accessible lightbox dialog is created and controlled by js/main.js. -->
<dialog class="lightbox" id="gallery-lightbox" aria-label="Enlarged gallery image">
    <button class="lightbox-close" type="button" aria-label="Close enlarged image">Close &times;</button><img src="" alt=""></dialog>
